[package]
name = "open-pen-viewer"
version = "0.4.0"
description = "OpenPenViewer — Desktop .pen design file viewer and editor"
authors = ["Tank4444"]
edition = "2021"

[lib]
name = "open_pen_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"

